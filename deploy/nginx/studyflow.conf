# Template de reverse proxy para o StudyFlow na VPS (estudo.aiontecno.com.br).
# Esta VPS é compartilhada com o ATCRM (porta 3000); o StudyFlow usa a 3002.
#
# Instalação (Ubuntu/Debian):
#   sudo cp deploy/nginx/studyflow.conf /etc/nginx/sites-available/studyflow
#   sudo ln -s /etc/nginx/sites-available/studyflow /etc/nginx/sites-enabled/studyflow
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS (depois que o DNS de estudo.aiontecno.com.br já estiver apontando para a VPS):
#   sudo certbot --nginx -d estudo.aiontecno.com.br
#   (o certbot edita este arquivo sozinho para adicionar o bloco :443 e o
#   redirecionamento http -> https; não precisa fazer isso à mão)
#   O cookie de sessão do app é "secure" em produção: sem HTTPS o login não
#   funciona, então rode o certbot antes de testar o acesso.
#
# Importante: só as portas 80/443 devem ficar públicas no firewall da VPS.
# A porta 3002 (Node) escuta apenas em 127.0.0.1 e não deve ser aberta.

# Limite de tentativas em /login (10 por minuto por IP, com rajada de 10).
# Fica fora do bloco server, no contexto http (sites-enabled é incluído lá).
limit_req_zone $binary_remote_addr zone=studyflow_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name estudo.aiontecno.com.br;

    # Teto do corpo da requisição no Nginx (413 antes de chegar no Node). O app
    # aceita imagens de até 10 MB (MAX_IMAGE_BYTES) e este valor deixa folga para
    # o restante do formulário multipart. Atenção: com o proxy.ts ativo o Next
    # só guarda em memória os primeiros 10 MB (10485760 bytes) de cada corpo
    # (experimental.proxyClientMaxBodySize); o que passar disso chega truncado
    # ao handler, sem erro. Uma imagem logo abaixo de 10 MB mais a sobrecarga do
    # multipart pode, portanto, ser cortada. Se isso importar, aumente essa
    # opção no next.config; o Nginx não resolve.
    client_max_body_size 12m;

    location = /login {
        limit_req zone=studyflow_login burst=10 nodelay;
        # Excesso de tentativas responde 429 (o padrão, 503, parece queda do site).
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        # NÃO reescreva o Host (nada de "proxy_set_header Host 127.0.0.1" nem
        # $proxy_host): o app confere se o cabeçalho Origin das requisições
        # POST/server actions bate com o Host; com Host alterado o login e as
        # ações de formulário são recusados. X-Forwarded-Proto/Host também são
        # necessários para as server actions do Next.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        # Chamadas ao gateway de IA podem demorar: o timeout configurável vai até
        # 600 s (src/features/ai/schema.ts) e o teste de conexão usa 60 s. O padrão
        # do Nginx (60 s) cortaria a resposta com um 504 em HTML antes de o app
        # devolver "Tempo esgotado". 660 s = 600 s + folga.
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        # Host precisa chegar intacto ao app (ver comentário em /login).
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
